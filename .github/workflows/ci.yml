name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --dev
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run pytest -q
      - run: uv run omics-rag --evaluate > evaluation-results.json
      - run: uv build
      - name: Verify installed wheel contains data and runs outside checkout
        shell: bash
        run: |
          uv venv /tmp/omics-wheel
          uv pip install --python /tmp/omics-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/omics-wheel/bin/omics-rag 'ALB in liver' --json > /tmp/wheel-answer.json
          /tmp/omics-wheel/bin/python -c "import json; x=json.load(open('/tmp/wheel-answer.json')); assert len(x['rows']) == 3 and x['total_tokens'] == 0"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python }}
          path: evaluation-results.json
