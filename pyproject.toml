[project]
name = "omics-rag-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "scikit-learn>=1.9.1",
    "pyyaml>=6.0",
    "faiss-cpu>=1.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omics_rag"]

[project.scripts]
omics-rag = "omics_rag.cli:main"

[project.optional-dependencies]
embeddings = [
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
